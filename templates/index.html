<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POWER AI</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
  <header>
    <h2>⚡ POWER AI</h2>
    <span>PERSONAL AI ASSISTANT</span>
  </header>

  <main>
    <div class="orb">
      <div class="core">P</div>
    </div>
    <h1>POWER AI</h1>
    <p id="status">Your AI Assistant is ready</p>

    <div id="chat">
      <div class="message bot">Hello! I am Power AI. How can I help you?</div>
    </div>

    <div class="controls">
      <input id="message" placeholder="Ask Power AI anything...">
      <button id="send">SEND</button>
      <button id="mic">🎙️</button>
    </div>
  </main>
  <footer>POWER AI • YOUR PERSONAL ASSISTANT</footer>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
